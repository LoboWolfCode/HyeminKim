<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | 김혜민 Hyemin Kim</title>
    <meta name="description" content="Commission or say hello to pixel artist Hyemin Kim.">
    <link rel="icon" href="../logo/hm_logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">

    <script src="../js/theme.js"></script>
    <script src="../js/motion.js"></script>
</head>
<body>

    <!-- Nav Bar STARTS -->
    <nav>
        <a class="logo-link" href="../index.html"><span class="kr">김혜민</span> | HYEMIN KIM</a>
        <input type="checkbox" id="check">
        <label for="check" class="checkbtn" aria-label="Menu"><i class="fas fa-bars"></i></label>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a class="selected" href="contact.html">Contact</a></li>
            <li><button id="theme-switch" type="button">CREAM</button></li>
        </ul>
    </nav>
    <!-- Nav Bar ENDS -->

    <!-- Form STARTS -->
    <main>
        <h1 class="page-title">CONTACT</h1>
        <p class="page-sub">Commissions, collaborations, or just to say hi.</p>

        <div class="contact-wrap panel reveal">
            <form id="fs-frm" name="simple-contact-form" accept-charset="utf-8"
                  action="https://formspree.io/f/xdkozqgo" method="post">
                <fieldset id="fs-frm-inputs">
                    <div>
                        <label class="con-label" for="full-name">NAME</label>
                        <input class="con-input" type="text" name="name" id="full-name"
                               placeholder="First and last" required>
                    </div>
                    <div>
                        <label class="con-label" for="email-address">EMAIL</label>
                        <input class="con-input" type="email" name="_replyto" id="email-address"
                               placeholder="email@domain.com" required>
                    </div>
                    <div>
                        <label class="con-label" for="message">MESSAGE</label>
                        <textarea class="con-input" rows="5" name="message" id="message"
                                  maxlength="1000" placeholder="Write your message here..." required></textarea>
                    </div>
                    <input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission">
                </fieldset>
                <button class="btn" type="submit">SEND MESSAGE</button>
            </form>
        </div>

        <p class="contact-alt">
            Or email <a href="mailto:hyeminkimArt12@gmail.com">hyeminkimArt12@gmail.com</a>
        </p>
    </main>
    <!-- Form ENDS -->

    <footer>
        <div class="icon-links">
            <a target="_blank" rel="noopener" href="https://www.instagram.com/minimin._.12/" class="fab fa-instagram" aria-label="Instagram"></a>
            <a href="mailto:hyeminkimArt12@gmail.com" class="fa-regular fa-envelope" aria-label="Email"></a>
        </div>
        <p>&copy; 2026 <span class="kr">김혜민</span> | Hyemin Kim | All rights reserved</p>
    </footer>

</body>
</html>
